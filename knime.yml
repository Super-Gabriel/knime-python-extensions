# This is the configuration file for your KNIME extension.
# It is used to define the extension's metadata and configuration.

# Extension metadata
name: PSO  # Will be concatenated with the group_id to an ID
group_id: org.tutorial
description: PSO # Human readable bundle name / description
long_description: A KNIME Python extension for selecting relevant features using Particle Swarm Optimization (PSO). The node evaluates feature subsets with a Random Forest regressor and cross-validation against a user-selected target column, and lets users configure the swarm size, number of iterations, inertia, cognitive and social coefficients, cross-validation folds, feature selection mode, threshold, and random seed.
version: 0.1.0 # Version of this Python node extension

# legal information 
author: QUIBIC
vendor: KNIME AG, Zurich, Switzerland
license_file: LICENSE.TXT # Best practice: put your LICENSE.TXT next to the knime.yml; otherwise you would need to change to path/to/LICENSE.txt


# Python settings 
pixi_toml_path: pixi.toml # This is necessary for bundling, but not needed during development
extension_module: ./src/extension # The .py Python module containing the nodes of your extension