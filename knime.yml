# This is the configuration file for your KNIME extension.
# It is used to define the extension's metadata and configuration.

# Extension metadata
name: mRMR  # Will be concatenated with the group_id to an ID
group_id: org.tutorial
description: mRMR # Human readable bundle name / description
long_description: A KNIME node for selecting the most relevant features using the fast minimum Redundancy Maximum Relevance (mRMR) algorithm. The node estimates mutual information between the input features and a user-selected target column, supports both regression and classification targets, and lets users configure the number of features, nearest neighbors, and random seed.
version: 0.1.0 # Version of this Python node extension

# legal information 
author: QUIBIC
vendor: KNIME AG, Zurich, Switzerland
license_file: LICENSE.TXT # Best practice: put your LICENSE.TXT next to the knime.yml; otherwise you would need to change to path/to/LICENSE.txt


# Python settings 
pixi_toml_path: pixi.toml # This is necessary for bundling, but not needed during development
extension_module: ./src/extension # The .py Python module containing the nodes of your extension